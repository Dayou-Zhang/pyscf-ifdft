name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install . pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Check installed package
        run: |
          python -m pip check
          python -c "from pyscf import ifdft, lib; assert ifdft.available_functionals() == ('ML25', 'ML26'); lib.load_library('libifdft_ifxc')"
